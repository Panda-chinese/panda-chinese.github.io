<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Panda Chinese: learn Chinese step by step</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fira+Sans:wght@400;500;600&family=Noto+Serif+SC:wght@500;700&display=swap" rel="stylesheet">
<style>
:root{
  color-scheme: light;
  --paper:#F1F4F2; --surface:#FFFFFF; --sunk:#E6ECE9; --ink:#18211E; --muted:#56635E; --line:#D3DBD7; --line-2:#AFBDB6;
  --jade:#1C6A55; --jade-ink:#FFFFFF; --jade-soft:#DCEBE4;
  --grid:#D98A7E; --grid-soft:#F0CDC7; --outline:#D9E0DC;
  --ok:#1E7742; --ok-soft:#DCEFE2; --bad:#AE3328; --bad-soft:#F7DFDB; --warn:#9A6408; --warn-soft:#F6EBD3;
  --t1:#C3332A; --t2:#A6620A; --t3:#1E7A3C; --t4:#2A58BC; --t5:#76817D; --focus:#2A58BC;
  --ui:"Fira Sans","Segoe UI",system-ui,-apple-system,sans-serif;
  --hz:"Noto Serif SC","Songti SC","STSong","SimSun","Noto Serif CJK SC",serif;
  box-sizing:border-box; padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    color-scheme: dark;
    --paper:#111715; --surface:#19211F; --sunk:#222C29; --ink:#E4EBE8; --muted:#9BA8A3; --line:#2B3633; --line-2:#43524D;
    --jade:#5DBB9D; --jade-ink:#0D1412; --jade-soft:#1D3730;
    --grid:#8C4C44; --grid-soft:#3E2925; --outline:#2F3B38;
    --ok:#62CD86; --ok-soft:#1B3325; --bad:#FF7D70; --bad-soft:#3B2220; --warn:#EFB14F; --warn-soft:#3A2E17;
    --t1:#FF6B5D; --t2:#EFA63A; --t3:#5FD07F; --t4:#88AAFF; --t5:#9BA8A3; --focus:#88AAFF;
  }
}
:root[data-theme="dark"]{
  color-scheme: dark;
  --paper:#111715; --surface:#19211F; --sunk:#222C29; --ink:#E4EBE8; --muted:#9BA8A3; --line:#2B3633; --line-2:#43524D;
  --jade:#5DBB9D; --jade-ink:#0D1412; --jade-soft:#1D3730;
  --grid:#8C4C44; --grid-soft:#3E2925; --outline:#2F3B38;
  --ok:#62CD86; --ok-soft:#1B3325; --bad:#FF7D70; --bad-soft:#3B2220; --warn:#EFB14F; --warn-soft:#3A2E17;
  --t1:#FF6B5D; --t2:#EFA63A; --t3:#5FD07F; --t4:#88AAFF; --t5:#9BA8A3; --focus:#88AAFF;
}
*,*::before,*::after{box-sizing:border-box}
html{height:100%;scroll-padding-top:calc(env(safe-area-inset-top,0px) + 120px)}
body{margin:0;min-height:100%;background:var(--paper);color:var(--ink);font-family:var(--ui);font-size:16px;line-height:1.5;-webkit-text-size-adjust:100%}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:40;background:var(--surface)}
button{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--focus);outline-offset:2px}
kbd{font-family:var(--ui);font-size:.75em;border:1px solid var(--line-2);border-radius:4px;padding:0 4px;margin-left:4px;color:var(--muted)}
.t1{color:var(--t1)}.t2{color:var(--t2)}.t3{color:var(--t3)}.t4{color:var(--t4)}.t5{color:var(--t5)}
.muted{color:var(--muted)} .small{font-size:14px} .sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}
.hzf{font-family:var(--hz)}

/* header */
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:30;background:var(--surface);border-bottom:1px solid var(--line)}
.top-in{max-width:1040px;margin:0 auto;padding:10px 20px 2px;display:flex;align-items:center;justify-content:space-between;gap:10px 20px;flex-wrap:wrap}
.brand{display:flex;align-items:center;gap:12px}
.brand .cells .cell{--cs:34px;font-size:22px;font-weight:700;color:var(--jade)}
.brand b{display:block;font-size:17px;font-weight:600;line-height:1.2}
.brand small{display:block;color:var(--muted);font-size:13px}
.toggles{display:flex;gap:6px 18px;flex-wrap:wrap;font-size:14px;color:var(--muted)}
.toggles label{display:inline-flex;align-items:center;gap:6px;cursor:pointer}
.toggles input{accent-color:var(--jade);width:16px;height:16px}
.tabs{max-width:1040px;margin:0 auto;padding:0 12px;display:flex;gap:2px;overflow-x:auto;scrollbar-width:none}
.tabs::-webkit-scrollbar{display:none}
.tab{border:0;background:none;padding:10px 12px 11px;font-weight:500;color:var(--muted);border-bottom:3px solid transparent;white-space:nowrap;cursor:pointer;display:inline-flex;align-items:center;gap:6px}
.tab .tab-hz{font-family:var(--hz);font-size:17px;font-weight:700}
.tab[aria-selected="true"]{color:var(--ink);border-bottom-color:var(--jade)}
.tab[aria-selected="true"] .tab-hz{color:var(--jade)}

main{max-width:1040px;margin:0 auto;padding:22px 20px 40px}
.view-title{font-size:24px;font-weight:600;margin:4px 0 6px;line-height:1.25}
.lead{color:var(--muted);max-width:70ch;margin:0 0 16px}
h2{font-size:16px}

/* 田字格 cells */
.cells{display:inline-flex;vertical-align:middle}
.cell{--cs:2.1em;display:inline-grid;place-items:center;width:var(--cs);height:var(--cs);font-family:var(--hz);line-height:1;color:var(--ink);
  border:1.5px solid var(--grid);background-color:var(--surface);
  background-image:linear-gradient(var(--grid-soft),var(--grid-soft)),linear-gradient(var(--grid-soft),var(--grid-soft));
  background-size:1px 100%,100% 1px;background-position:center;background-repeat:no-repeat}
.cell + .cell{margin-left:-1.5px}
.cells.sm .cell{--cs:44px;font-size:26px}
.cells.md .cell{--cs:64px;font-size:40px}
.cells.lg .cell{--cs:76px;font-size:48px}
.cells.xl .cell{--cs:96px;font-size:62px}

/* controls */
.chip{border:1px solid var(--line-2);background:var(--surface);color:var(--ink);border-radius:999px;padding:5px 13px;font-size:14px;cursor:pointer;line-height:1.4}
.chip[aria-pressed="true"]{background:var(--jade);color:var(--jade-ink);border-color:var(--jade)}
.chip .cnt{opacity:.7;font-size:12px;margin-left:2px}
.seg{display:flex;flex-wrap:wrap;gap:6px}
.seg button{border:1px solid var(--line-2);background:var(--surface);border-radius:8px;padding:7px 13px;font-size:14px;color:var(--muted);cursor:pointer}
.seg button[aria-pressed="true"]{background:var(--jade-soft);border-color:var(--jade);color:var(--ink);font-weight:600}
.filters{margin:14px 0 4px;display:grid;gap:8px}
.frow{display:flex;flex-wrap:wrap;align-items:center;gap:8px;margin:8px 0}
.flabel{font-size:13px;color:var(--muted);min-width:4.5em}
.btn{border:1px solid var(--line-2);background:var(--surface);color:var(--ink);border-radius:8px;padding:9px 16px;font-weight:500;cursor:pointer;display:inline-flex;align-items:center;gap:6px;line-height:1.3}
.btn:hover{border-color:var(--jade)}
.btn.primary{background:var(--jade);border-color:var(--jade);color:var(--jade-ink)}
.btn.primary kbd{color:inherit;border-color:currentColor;opacity:.75}
.btn.quiet{border-color:transparent;background:none;color:var(--muted)}
.btn.sm{padding:4px 12px;font-size:14px}
.btn.sel{border-color:var(--jade);background:var(--jade-soft)}
.btn svg{width:20px;height:20px}
.btn.play.big{padding:12px 22px;font-size:17px}
.link{border:0;background:none;color:var(--jade);font-weight:500;cursor:pointer;padding:0;text-decoration:underline;text-underline-offset:3px}
.say{border:0;background:none;color:var(--jade);cursor:pointer;padding:4px;border-radius:6px;display:inline-flex;vertical-align:middle}
.say svg{width:20px;height:20px}
.say.sm svg{width:17px;height:17px}

/* exercises */
.instr{font-weight:500;margin:6px 0 8px;max-width:72ch}
.note{font-size:14px;color:var(--muted);border-left:3px solid var(--grid);padding:2px 0 2px 10px;margin:8px 0 12px;max-width:72ch}
.items{list-style:none;margin:0;padding:0;border-top:1px solid var(--line)}
.item{display:grid;grid-template-columns:2.2em 1fr;gap:6px;padding:16px 0 14px;border-bottom:1px solid var(--line)}
.num{color:var(--muted);font-variant-numeric:tabular-nums;padding-top:3px;font-size:15px}
.body{min-width:0}
.q{font-family:var(--hz),var(--ui);font-size:19px;margin-bottom:4px}
.q.q-py{font-family:var(--ui);font-size:18px;font-weight:500}
.q u{text-decoration-color:var(--grid);text-decoration-thickness:2px;text-underline-offset:4px}
.sub-arrow{color:var(--muted)} .sub-word{color:var(--jade);font-weight:700}
.py-line{display:block;font-size:14px;color:var(--muted);letter-spacing:.01em}
body.hide-py .py-line, body.hide-py .tile-py{display:none}
.in{font:inherit;font-size:18px;font-family:var(--hz),var(--ui);padding:7px 10px;border:1.5px solid var(--line-2);border-radius:7px;background:var(--surface);color:var(--ink);min-width:0;max-width:100%}
.in.py,.in.num{font-family:var(--ui)}
.in.wide{width:100%;max-width:560px;display:block;margin-top:8px}
.in.big{font-size:22px;padding:9px 12px}
.in.blank{width:4.6em;height:1.6em;line-height:1.2;padding:0 4px;margin:0 3px;text-align:center;border-width:0 0 2px;border-radius:3px 3px 0 0;background:var(--sunk);font-size:19px;vertical-align:baseline}
.in.ok{border-color:var(--ok);background:var(--ok-soft)}
.in.bad{border-color:var(--bad);background:var(--bad-soft)}
.in.open{width:100%;max-width:560px;display:block;margin-top:8px;font-size:17px}
.in-row{display:block;margin-top:6px}
.in-label{display:block;font-size:13px;color:var(--muted);margin-top:4px}
.in-row .in.wide{margin-top:2px}
.fill-text{font-family:var(--hz);font-size:20px;line-height:2.2}
.tiles{display:flex;flex-wrap:wrap;gap:6px}
.tile{display:inline-flex;flex-direction:column;align-items:center;border:1px solid var(--line-2);border-radius:6px;padding:3px 10px;background:var(--surface)}
.tile-hz{font-family:var(--hz);font-size:20px;line-height:1.3}
.tile-py{font-size:12px}
.py-item,.chars-item,.match,.dict{display:flex;align-items:center;gap:12px;flex-wrap:wrap}
.dict .in.wide{margin-top:0;flex:1 1 220px}
.py-in{display:inline-flex;flex-direction:column;gap:2px}
.pv{font-size:15px;min-height:1.2em;padding-left:2px}
.q-hz{font-family:var(--hz);font-size:22px;min-width:5em}
.match-py{font-size:19px;min-width:9em;font-weight:500}
select.in{font-family:var(--hz),var(--ui);padding-right:28px}
.opts{display:flex;flex-wrap:wrap;gap:8px;margin-top:8px}
.opts.col{flex-direction:column;max-width:520px;margin:16px auto 0}
.opt{text-align:left;font-size:16px;padding:8px 14px;border:1.5px solid var(--line-2);border-radius:8px;background:var(--surface);color:var(--ink);cursor:pointer;line-height:1.4}
.opt.zh{font-family:var(--hz),var(--ui);font-size:18px}
.opt.pyopt{font-size:19px;min-width:4.5em;text-align:center}
.opt.sel{border-color:var(--jade);background:var(--jade-soft)}
.opt.right{border-color:var(--ok);background:var(--ok-soft)}
.opt.wrong{border-color:var(--bad);background:var(--bad-soft)}
.reveal{margin:8px 0}
.bank{display:flex;flex-wrap:wrap;gap:6px;margin:6px 0 12px}
.bank span{font-family:var(--hz);font-size:19px;padding:1px 12px;border:1.5px dashed var(--grid);border-radius:5px;background:var(--surface)}
.fb{font-size:15px;margin-top:6px}
.fb .ans{font-family:var(--hz),var(--ui);font-size:18px}
.ok-l{color:var(--ok);font-weight:600} .bad-l{color:var(--bad);font-weight:600;margin-right:4px}
.why{color:var(--muted);font-size:14px}
.hint{font-size:14px;color:var(--muted)}
.model{margin-top:10px;border-left:3px solid var(--jade);padding:4px 0 4px 12px}
.model-label{font-size:13px;color:var(--muted)}
.model-txt{font-family:var(--hz);font-size:19px}
.grade{margin-top:8px;display:flex;gap:8px;align-items:center;flex-wrap:wrap;font-size:14px}
.open-act{margin-top:8px}
.item.is-right .num{color:var(--ok);font-weight:600}
.item.is-wrong .num{color:var(--bad);font-weight:600}
.actions{position:sticky;bottom:env(safe-area-inset-bottom,0px);z-index:5;background:var(--paper);padding:12px 0;display:flex;flex-wrap:wrap;gap:8px;align-items:center;border-top:1px solid var(--line);margin-top:6px}
.actions.plain{position:static;border:0}
.score{margin-left:auto;font-size:15px}
.passage{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:10px 16px;margin:10px 0 14px}
.passage summary{cursor:pointer;font-weight:600;font-size:15px}
.pl{margin-top:6px}
.pline{display:grid;grid-template-columns:4.6em 1fr auto;gap:8px;padding:4px 0;align-items:start}
.spk{font-family:var(--hz);color:var(--muted);font-size:15px;padding-top:3px}
.hz-line{font-family:var(--hz);font-size:19px;display:block}
.passage.is-card .pl{max-width:480px;margin:10px auto 4px;border:1px solid var(--line-2);padding:10px 14px;background:var(--paper)}
.passage.is-card .pline{grid-template-columns:0 1fr auto}

/* book lists */
.cat{margin-top:22px}
.cat h2{font-size:15px;color:var(--muted);font-weight:600;margin:0 0 4px}
.set-row{display:grid;grid-template-columns:3em 1fr auto;gap:10px;align-items:center;width:100%;text-align:left;padding:10px 6px;border:0;border-bottom:1px solid var(--line);background:none;cursor:pointer}
.set-row:hover{background:var(--surface)}
.u-tag{font-size:13px;color:var(--jade);font-weight:600}
.set-src{display:block;font-weight:500}
.set-title{display:block;color:var(--muted);font-size:14px}
.badge{font-size:13px;padding:2px 9px;border-radius:999px;background:var(--sunk);color:var(--muted);font-variant-numeric:tabular-nums;white-space:nowrap}
.badge.full{background:var(--ok-soft);color:var(--ok)}
.g-row{grid-template-columns:9em 1fr auto}
.g-zh{font-family:var(--hz);color:var(--jade);font-size:15px}
.crumbs{display:flex;gap:14px;align-items:center;flex-wrap:wrap;margin-bottom:6px;font-size:14px}
.pager{display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap;margin-top:22px}
.gbody{max-width:74ch}
.gbody h3{font-size:16px;margin:20px 0 6px}
.warn{border-left:3px solid var(--bad);padding:4px 0 4px 12px;background:none;font-size:15px}
.exs{display:grid;gap:2px;margin:6px 0 10px}
.ex{padding:8px 0;border-bottom:1px dashed var(--line)}
.ex-hz{font-family:var(--hz);font-size:19px}
.ex-en{font-size:14px}
.drill-h{margin:26px 0 4px;font-size:18px}

/* characters */
.c-stage{max-width:620px;margin:18px auto 0}
.progress{height:4px;background:var(--sunk);border-radius:2px;overflow:hidden}
.progress .bar{height:100%;background:var(--jade);transition:width .25s}
.pcount{font-size:13px;color:var(--muted);text-align:right;margin:4px 0 8px;font-variant-numeric:tabular-nums}
.fcard{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:26px 18px;text-align:center;min-height:250px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:12px;cursor:pointer}
.fcard.static{cursor:default}
.phrase{font-family:var(--hz);font-size:30px;line-height:1.4}
.big-py{font-size:24px;font-weight:500}
.mean{font-size:18px}
.meta{font-size:13px;color:var(--muted);display:flex;align-items:center;gap:6px}
.tap{font-size:14px;color:var(--muted)}
.prompt-e{font-size:22px;font-weight:500}
.card-actions{display:flex;justify-content:center;gap:10px;margin-top:14px;flex-wrap:wrap}
.qrow{display:flex;gap:10px;margin-top:14px;align-items:flex-start;justify-content:center;flex-wrap:wrap}
.qrow .in{flex:1 1 240px;max-width:380px}
.qrow .py-in{flex:1 1 240px;max-width:380px}
.qrow .py-in .in{width:100%;max-width:none}
.cfb{text-align:center;margin-top:10px;min-height:1.5em}
.summary{text-align:center;background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:26px}
.summary h2{font-size:20px;margin:0 0 6px}
.missed{display:flex;flex-wrap:wrap;gap:6px;justify-content:center}
.mchip{font-family:var(--hz);font-size:20px;padding:2px 10px;border:1px solid var(--bad);border-radius:6px}
.empty{color:var(--muted);text-align:center;padding:30px 0}
.list-head{display:flex;gap:12px;align-items:center;margin-bottom:10px;flex-wrap:wrap}
.list-head .in{flex:1 1 260px;font-family:var(--ui);font-size:16px}
.table-wrap{overflow-x:auto}
table.wl{width:100%;border-collapse:collapse;font-size:15px}
.wl th{text-align:left;font-weight:500;color:var(--muted);font-size:13px;padding:6px;border-bottom:1px solid var(--line-2)}
.wl td{padding:7px 6px;border-bottom:1px solid var(--line);vertical-align:middle}
.wl td.hz{font-family:var(--hz);font-size:21px;white-space:nowrap}
.wl td.pyc{white-space:nowrap}
.c-stage:has(.wl){max-width:none}

/* test */
.t-top{position:sticky;top:calc(env(safe-area-inset-top,0px) + 92px);z-index:4;background:var(--paper);padding-top:4px}
.tq{padding-top:4px}
.tq .items{border-top:0}
.t-result{display:flex;gap:16px;align-items:center;flex-wrap:wrap;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:16px 18px;margin-bottom:18px}
.t-score{font-size:40px;font-weight:600;color:var(--jade);font-variant-numeric:tabular-nums}
.tq.q-wrong{border-left:3px solid var(--bad);padding-left:12px}
.done .tq{margin-bottom:10px}
.setup{max-width:760px}

/* writing */
.w-strip{display:flex;flex-wrap:wrap;margin:10px 0 4px;padding:1px 0 0 1px}
.mini{width:46px;height:46px;font-family:var(--hz);font-size:25px;border:1px solid var(--grid-soft);background:var(--surface);color:var(--ink);cursor:pointer;margin:-1px 0 0 -1px;position:relative;display:grid;place-items:center;line-height:1;padding:0}
.mini.on{outline:2.5px solid var(--jade);outline-offset:-2px;z-index:1}
.mini.done::after{content:"";position:absolute;right:4px;top:4px;width:6px;height:6px;border-radius:50%;background:var(--ok)}
.mini-py{font-family:var(--ui);font-size:11px}
.w-main{display:grid;grid-template-columns:minmax(260px,350px) 1fr;gap:26px;margin-top:16px;align-items:start}
.w-box{position:relative;width:100%;max-width:350px;aspect-ratio:1/1;background:var(--surface);color:var(--grid)}
.w-box.sm{max-width:150px}
.w-box .grid{position:absolute;inset:0;width:100%;height:100%}
.hw{position:absolute;inset:0}
.w-box canvas.draw{position:absolute;inset:0;touch-action:none;cursor:crosshair}
.w-status{min-height:1.6em;margin:10px 0 6px;font-size:15px}
.w-actions{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.w-info{display:grid;gap:14px;align-content:start}
.w-prompt{display:flex;gap:14px;align-items:center}
.w-small{--cs:64px;font-size:40px}
.w-words{display:grid;gap:4px}
.w-word{font-size:15px}
.w-word .hzf{font-size:19px;margin-right:4px}
.w-nav{display:flex;gap:8px;flex-wrap:wrap}
.hw-missing{padding:20px;color:var(--bad)}
.frow.wrap{gap:6px}


/* menus */
.howto{background:var(--surface);border:1px solid var(--line);border-left:4px solid var(--jade);border-radius:8px;padding:12px 16px;margin:4px 0 16px;max-width:80ch;font-size:15px}
.howto p{margin:0 0 6px}.howto p:last-child{margin:0}
.menu-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(270px,1fr));gap:14px;margin:12px 0}
.mcard{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:16px 18px;display:flex;flex-direction:column;gap:8px}
.mcard h2{font-size:17px;margin:0}
.mcard p{margin:0;font-size:15px}
.mcard .onscreen{font-size:14px;color:var(--muted)}
.mcard .btn{align-self:flex-start;margin-top:auto}
.btn:disabled{opacity:.45;cursor:not-allowed}
.sess-head{display:flex;align-items:center;gap:12px;flex-wrap:wrap;margin-bottom:8px}
.sess-head b{font-size:18px}
.cat-desc{color:var(--muted);font-size:14px;margin:-2px 0 6px;max-width:72ch}
.sel-count{font-size:14px;color:var(--muted);margin:4px 0}
.btn.playing{background:var(--jade-soft);border-color:var(--jade)}
.pendl{color:var(--warn);font-weight:600}
/* midterm mock test */
.mk-nav{display:flex;flex-wrap:wrap;gap:4px;margin:0 0 16px;padding:10px;background:var(--surface);border:1px solid var(--line);border-radius:10px}
.mk-nav button{width:32px;height:32px;border:1px solid var(--line-2);border-radius:6px;background:var(--surface);font-size:13px;cursor:pointer;padding:0;font-variant-numeric:tabular-nums}
.mk-nav button.ans{background:var(--sunk);border-color:var(--muted)}
.mk-nav button.ok{background:var(--ok-soft);border-color:var(--ok);color:var(--ok)}
.mk-nav button.bad{background:var(--bad-soft);border-color:var(--bad);color:var(--bad)}
.mk-nav button.pend{background:var(--warn-soft);border-color:var(--warn);color:var(--warn)}
.mk-part{font-size:15px;font-weight:600;letter-spacing:.02em;margin:28px 0 8px;color:var(--jade)}
.mk-instr{background:var(--surface);border:1px solid var(--line);border-left:4px solid var(--jade);border-radius:8px;padding:12px 16px;margin:18px 0 12px}
.mk-instr p{margin:0}.mk-instr .note2{font-size:14px;color:var(--muted);margin-top:6px}
.mk-paraplay{margin-top:8px}
.mk-q{display:grid;grid-template-columns:110px 1fr;gap:12px;margin:0 0 12px}
.mk-qhead{background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:8px 10px;font-size:13px;color:var(--muted);align-self:start}
.mk-qhead b{display:block;font-size:15px;color:var(--ink)}
.mk-qcard{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:14px 16px;min-width:0}
.mk-q.ok .mk-qcard,.mk-q.ok .mk-qhead{border-color:var(--ok)}
.mk-q.bad .mk-qcard,.mk-q.bad .mk-qhead{border-color:var(--bad)}
.mk-q.pend .mk-qcard,.mk-q.pend .mk-qhead{border-color:var(--warn)}
.mk-label{font-weight:500;margin-bottom:6px}
.mk-text{font-family:var(--hz),var(--ui);font-size:18px;margin-bottom:6px}.mk-text.en{font-family:var(--ui);font-size:16px}
.mk-opts{display:flex;flex-direction:column;gap:6px;margin-top:6px}.mk-opts.row{flex-direction:row;flex-wrap:wrap}
.mk-opt{text-align:left;padding:7px 12px;border:1.5px solid var(--line-2);border-radius:8px;background:var(--surface);cursor:pointer;font-size:17px;line-height:1.4;color:var(--ink)}
.mk-opt:disabled{cursor:default;opacity:1}
.mk-opt .ol{color:var(--muted)}.mk-opt .hzf{font-size:18px}
.mk-opt.sel{border-color:var(--jade);background:var(--jade-soft)}
.mk-opt.right{border-color:var(--ok);background:var(--ok-soft)}
.mk-opt.wrong{border-color:var(--bad);background:var(--bad-soft)}
.mk-pyrow{display:flex;align-items:center;gap:8px;font-size:19px;flex-wrap:wrap}
.in.mk-py{width:8em;font-family:var(--ui)}
.in.mk-let{width:2.6em;text-align:center;font-family:var(--ui);font-weight:600;padding:2px 4px;margin:0 4px;text-transform:uppercase}
.mk-ta{width:100%;min-height:80px;display:block}
.mk-bank{font-family:var(--hz);font-size:18px;margin-bottom:8px;display:flex;flex-wrap:wrap;gap:4px 16px}.mk-bank b{font-family:var(--ui)}
.mk-lline{font-family:var(--hz);font-size:18px;line-height:2.4}
.mk-words{font-family:var(--hz);font-size:19px;margin-bottom:4px}
.mk-conv{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:12px 16px;margin:0 0 14px;font-family:var(--hz);font-size:17px;line-height:1.9}
.mk-fb{margin-top:10px;font-size:15px}.mk-fb .ans{font-family:var(--hz),var(--ui);font-weight:600}
.mk-scr{margin-top:6px;padding:8px 10px;background:var(--sunk);border-radius:6px;font-size:15px}
.mk-result{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:18px;margin-bottom:18px}
.mk-result .big{font-size:42px;font-weight:600;color:var(--jade);font-variant-numeric:tabular-nums;line-height:1.1}
.mk-result table,.mk-hist table{border-collapse:collapse;margin:12px 0;font-size:15px;width:100%;max-width:520px}
.mk-result td,.mk-hist td{padding:6px 8px;border-bottom:1px solid var(--line)}
.mk-result td:last-child,.mk-hist td:last-child{text-align:right;font-variant-numeric:tabular-nums}
.mk-hist{margin-top:20px}.mk-hist h2{font-size:15px;color:var(--muted);font-weight:600;margin:0}
.mk-bar{position:sticky;bottom:env(safe-area-inset-bottom,0px);background:var(--paper);border-top:1px solid var(--line);padding:12px 0;display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin-top:20px;z-index:5}
.mk-count{margin-left:auto;font-size:14px;color:var(--muted)}
.mk-timer{font-variant-numeric:tabular-nums;font-weight:600;padding:4px 10px;border:1px solid var(--line-2);border-radius:6px;font-size:14px}
.mk-timer.low{color:var(--bad);border-color:var(--bad)}
@media (max-width:640px){.mk-q{grid-template-columns:1fr;gap:4px}.mk-qhead{display:flex;gap:10px;align-items:baseline;padding:4px 10px}.mk-qhead b{display:inline}}

/* header buttons, settings, focus mode */
.top-in{flex-wrap:nowrap}
.brand{min-width:0}
.brand>span:last-child{min-width:0}
.brand small,.brand b{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.hdr-right{flex:none}
.hdr-right{display:flex;align-items:center;gap:6px}
.icon-btn{border:1px solid var(--line-2);background:var(--surface);color:var(--muted);border-radius:8px;width:36px;height:36px;display:inline-grid;place-items:center;cursor:pointer;padding:0}
.icon-btn:hover{color:var(--ink);border-color:var(--jade)}
.icon-btn svg{width:18px;height:18px}
.settings{position:relative}
.pop{position:absolute;right:0;top:calc(100% + 6px);background:var(--surface);border:1px solid var(--line-2);border-radius:10px;padding:12px 14px;display:grid;gap:10px;min-width:230px;box-shadow:0 8px 24px rgba(0,0,0,.14);z-index:40;font-size:14px}
.pop[hidden]{display:none}
.pop label{display:flex;align-items:center;gap:8px;cursor:pointer}
.pop input{accent-color:var(--jade);width:16px;height:16px}
.show-hdr{position:fixed;top:calc(env(safe-area-inset-top,0px) + 8px);right:10px;z-index:45;display:none;box-shadow:0 2px 10px rgba(0,0,0,.12)}
body.focus .top{display:none}
body.focus .show-hdr{display:inline-grid}
body.focus main{padding-top:52px}
body.focus .t-top{top:env(safe-area-inset-top,0px);padding-right:52px}
/* collapsible how-to and cards */
details.howto{padding:10px 16px}
details.howto>summary{cursor:pointer;font-weight:600;color:var(--jade);list-style:none;display:flex;align-items:center;gap:6px}
details.howto>summary::-webkit-details-marker{display:none}
details.howto>summary::before{content:"▸";font-size:12px;transition:transform .15s}
details.howto[open]>summary::before{transform:rotate(90deg)}
details.howto[open]>summary{margin-bottom:8px}
details.more>summary{cursor:pointer;font-size:14px;color:var(--jade);font-weight:500}
details.more[open]>summary{margin-bottom:6px}
details.more p{margin:0 0 6px;font-size:14px}
/* word modal */
.wl-hz{border:0;background:none;font-family:var(--hz);font-size:21px;color:var(--jade);cursor:pointer;padding:2px 4px;border-radius:6px;text-decoration:underline dotted;text-underline-offset:5px}
.modal{position:fixed;inset:0;background:rgba(0,0,0,.45);z-index:60;display:grid;place-items:center;padding:16px}
.modal[hidden]{display:none}
.modal-box{background:var(--surface);border-radius:14px;padding:22px 18px;max-width:580px;width:100%;max-height:90vh;overflow:auto;position:relative;text-align:center}
.modal-x{position:absolute;top:10px;right:10px}
.wm-head{display:flex;justify-content:center;align-items:center;gap:6px}
.wm-hz{font-size:30px}
.wm-boxes{display:flex;flex-wrap:wrap;gap:8px;justify-content:center;margin:14px 0 6px}
.w-box.wm-box{max-width:none;flex:none}
body.modal-open{overflow:hidden}
.w-stripbar{display:flex;align-items:center;gap:14px;margin:10px 0 4px}
.w-strip{position:relative}
.w-strip.row{flex-wrap:nowrap;overflow-x:auto;padding-bottom:6px;scrollbar-width:thin}
.w-strip.row .mini{flex:none}

/* favourites */
.fav{border:0;background:none;cursor:pointer;color:var(--muted);font-size:21px;line-height:1;padding:3px 6px;border-radius:6px;font-family:var(--ui)}
.fav:hover,.fav.on{color:#D99A00}
.fav.pill{border:1px solid var(--line-2);font-size:14px;padding:4px 10px;display:inline-flex;align-items:center;gap:6px;background:var(--surface)}
.fav.pill .star{font-size:17px}
.fav.pill.on{border-color:#D99A00;color:var(--ink)}
.fav.pill.on .star{color:#D99A00}
.favrow{margin:2px 0 8px}
.body.has-fav{position:relative;padding-right:34px}
.body>.fav{position:absolute;top:-4px;right:-6px}
.fcard{position:relative}
.fcard>.fav,.mk-qcard>.fav{position:absolute;top:8px;right:8px}
.mk-qcard{position:relative}
td.favc{width:34px;padding:2px}
.wm-head .fav{margin-left:2px}
.fav-row{display:flex;align-items:center;gap:8px;border-bottom:1px solid var(--line)}
.fav-open{flex:1;text-align:left;border:0;background:none;padding:10px 4px;cursor:pointer;display:flex;flex-direction:column;gap:2px;color:var(--ink);min-width:0}
.fav-open .fl{font-family:var(--hz),var(--ui);font-size:17px}
.fav-open:hover .fl{color:var(--jade)}
.fav-open .fs{font-size:13px;color:var(--muted)}
.icon-btn.sm{width:30px;height:30px;font-size:13px}
.setaudio{margin:6px 0 10px}
/* help */
.modal-box.help-box{text-align:left;max-width:640px}
.help-box h2{font-size:17px;margin:18px 0 6px}
.help-box p{font-size:15px;margin:0 0 8px}
.bk-ta{width:100%;font-family:ui-monospace,monospace;font-size:12px;margin:6px 0}
/* panda + quick challenge */
.tab-panda{width:22px;height:20px;margin-left:6px;vertical-align:-4px}
.panda{display:block;overflow:visible}
.panda .v{display:none}
.panda .v.on{display:inline}
.panda.jump{animation:pd-jump .7s ease}
.panda.jump-loop{animation:pd-jump 1.2s ease infinite}
@keyframes pd-jump{0%{transform:translateY(0)}30%{transform:translateY(-16%)}55%{transform:translateY(0)}72%{transform:translateY(-5%)}100%{transform:translateY(0)}}
.panda.shake{animation:pd-shake .6s ease}
@keyframes pd-shake{0%,100%{transform:translateX(0)}20%{transform:translateX(-5%)}40%{transform:translateX(5%)}60%{transform:translateX(-3%)}80%{transform:translateX(3%)}}
.panda.sway{animation:pd-sway 3s ease-in-out infinite;transform-origin:50% 100%}
@keyframes pd-sway{0%,100%{transform:rotate(-2deg)}50%{transform:rotate(2deg)}}
.panda.party{animation:pd-party .9s ease-in-out infinite;transform-origin:50% 100%}
@keyframes pd-party{0%,100%{transform:translateY(0) rotate(0)}25%{transform:translateY(-8%) rotate(-5deg)}75%{transform:translateY(-8%) rotate(5deg)}}
.panda .tear{animation:pd-tear 1s ease-in infinite}
.panda .tear.t2{animation-delay:.45s}
@keyframes pd-tear{0%{transform:translateY(0);opacity:1}100%{transform:translateY(16px);opacity:0}}
.panda .fx-stars.on{animation:pd-tw 1.1s ease-in-out infinite}
@keyframes pd-tw{0%,100%{opacity:1}50%{opacity:.25}}
.qc-hero{display:flex;align-items:center;gap:20px;flex-wrap:wrap;margin-bottom:8px}
.qc-big{width:140px;flex:none}
.qc-hero .lead{margin:0;max-width:52ch}
.qc-custom{display:inline-flex;align-items:center;gap:6px;font-size:14px;color:var(--muted)}
.qc-custom .in{width:5.5em;padding:5px 8px;font-size:15px}
.qc-est{font-weight:500;margin:14px 0 10px}
.btn.big{padding:12px 30px;font-size:17px}
.qc-hz{font-family:var(--hz);font-size:42px;line-height:1.3}
.qc-write{display:flex;flex-direction:column;align-items:center;gap:8px}
.qc-write .w-prompt{text-align:center}
.w-box.qc-wbox{max-width:300px}
.qc-corner{position:fixed;right:12px;bottom:calc(env(safe-area-inset-bottom,0px) + 18px);width:92px;z-index:20;pointer-events:none}
.qc-bubble{position:absolute;right:78%;top:-4px;background:var(--surface);border:1px solid var(--line-2);border-radius:10px;padding:4px 10px;font-size:13px;font-weight:600;white-space:nowrap;opacity:0;transform:translateY(4px);transition:opacity .2s,transform .2s;box-shadow:0 2px 8px rgba(0,0,0,.08)}
.qc-bubble.on{opacity:1;transform:none}
.qc-bubble.ok{color:var(--ok)}
.qc-bubble.bad{color:var(--bad)}
#qc-run{padding-bottom:120px}
.qc-result{text-align:center;background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:22px 18px;margin-bottom:18px}
.qc-final{width:180px;margin:0 auto}
.qc-pct{font-size:54px;font-weight:600;color:var(--jade);line-height:1.1;font-variant-numeric:tabular-nums}
.qc-result.facepalm .qc-pct{color:var(--bad)}
.qc-result.awkward .qc-pct{color:var(--warn)}
.qc-result.ecstatic .qc-pct{background:linear-gradient(90deg,#E0A100,#E2574C,#7A5AF8,#1C9A75);-webkit-background-clip:text;background-clip:text;color:transparent}
.qc-msg{font-size:19px;font-weight:600;margin:4px 0 6px}
.qc-endbtns{justify-content:center}
@media (max-width:640px){.qc-corner{width:66px}.qc-big{width:110px}}
@media (prefers-reduced-motion:reduce){.panda,.panda *{animation:none!important}}
.set-box{font-size:16px}
.set-box p,.set-box li{font-size:16px;line-height:1.6}
.set-box h2{font-size:19px;margin:22px 0 8px}
.set-box h3{font-size:17px;margin:20px 0 6px;color:var(--jade)}
.set-box ul,.set-box ol{margin:0 0 8px;padding-left:24px}
.set-box li{margin:3px 0}
.set-opt{display:flex;gap:12px;align-items:flex-start;padding:10px 0;border-bottom:1px solid var(--line);cursor:pointer}
.set-opt input{width:22px;height:22px;margin-top:2px;accent-color:var(--jade);flex:none}
.set-opt b{display:block}
.set-opt small{display:block;color:var(--muted);font-size:14px;margin-top:2px}
.bk-panel{background:var(--sunk);border-radius:10px;padding:14px 16px;margin:12px 0 4px}
.bk-panel .card-actions{margin:10px 0 4px}
.set-box .tip{background:var(--jade-soft);border-radius:8px;padding:10px 14px}
/* ---------- learn: path ---------- */
.lp-head{display:flex;justify-content:space-between;align-items:flex-end;gap:12px;flex-wrap:wrap}
.lp-head .lead{margin:0;max-width:56ch}
.lp-stats{display:flex;gap:8px;flex-wrap:wrap}
.lp-stat{background:var(--surface);border:1px solid var(--line);border-radius:999px;padding:6px 14px;font-size:14px;color:var(--muted)}
.lp-stat b{color:var(--ink)}
.lp-wrap{--lp-paper:#FBF4E6;--lp-road:#EBDDBF;--lp-dash:#D9534F;--lp-text:#5A4A2E;--lp-border:#EADBC0;background:radial-gradient(circle at 18% 8%,rgba(255,255,255,.7) 0,transparent 38%),radial-gradient(circle at 85% 55%,rgba(253,226,200,.6) 0,transparent 42%),var(--lp-paper);border:1px solid var(--lp-border);border-radius:18px;margin-top:14px;overflow:hidden}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]) .lp-wrap{background:var(--lp-paper);--lp-paper:#1E2523;--lp-road:#2E3935;--lp-dash:#E07A6F;--lp-text:#D9CBB0;--lp-border:#2E3835}}
:root[data-theme="dark"] .lp-wrap{background:var(--lp-paper);--lp-paper:#1E2523;--lp-road:#2E3935;--lp-dash:#E07A6F;--lp-text:#D9CBB0;--lp-border:#2E3835}
.lp-map{position:relative;max-width:560px;margin:0 auto}
.lp-line{position:absolute;left:0;top:0;pointer-events:none}
.lp-road{fill:none;stroke:var(--lp-road);stroke-width:26;stroke-linecap:round}
.lp-dash{fill:none;stroke:var(--lp-dash);stroke-width:3;stroke-dasharray:2 12;stroke-linecap:round;opacity:.65}
.lp-banner{position:absolute;left:50%;transform:translateX(-50%);display:flex;align-items:center;filter:drop-shadow(0 3px 6px rgba(0,0,0,.12));z-index:2}
.lp-roll{width:14px;height:88px;border-radius:7px;background:linear-gradient(90deg,#7A2420,#C2392F 50%,#7A2420);flex:none}
.lp-bt{background:#FFF8E7;border-top:3px solid #D4A84B;border-bottom:3px solid #D4A84B;padding:8px 22px;text-align:center;min-width:210px;height:74px;display:flex;flex-direction:column;justify-content:center}
.lp-bt b{font-size:21px;color:#7A2420;display:block}
.lp-bt span{font-size:13px;color:#6B5A3A;white-space:nowrap}
.lp-node{position:absolute;transform:translate(-50%,-50%);width:70px;height:70px;border-radius:50%;border:4px solid #D7C7A6;background:#fff;cursor:pointer;display:grid;place-items:center;box-shadow:0 5px 0 #CDBB95;transition:transform .15s;padding:0;z-index:3}
.lp-node:hover{transform:translate(-50%,-53%)}
.lp-node:active{transform:translate(-50%,-47%);box-shadow:0 2px 0 #CDBB95}
.lp-ic{font-size:30px;font-weight:700;color:#7A6A4A;line-height:1}
.lp-node.done{background:#FFE7A3;border-color:#E0A100;box-shadow:0 5px 0 #C08A00}
.lp-node.done .lp-ic{color:#8A5A00}
.lp-node.rec{background:#E2453C;border-color:#B8302A;box-shadow:0 5px 0 #8E2420}
.lp-node.rec .lp-ic{color:#fff}
.lp-node.rec::after{content:"";position:absolute;inset:-12px;border-radius:50%;border:3px solid rgba(226,69,60,.45);animation:lp-pulse 1.8s ease-out infinite}
@keyframes lp-pulse{0%{transform:scale(.85);opacity:1}100%{transform:scale(1.25);opacity:0}}
.lp-node.check{border-radius:24px}
.lp-node.check.rec::after{border-radius:30px}
.lp-node.big{position:relative;transform:none;margin:4px auto 8px;cursor:default;left:auto;top:auto}
.lp-label{position:absolute;transform:translateX(-50%);text-align:center;width:150px;pointer-events:none;z-index:3}
.lp-t{display:block;font-size:13px;font-weight:600;color:var(--lp-text);line-height:1.25;margin-top:1px}
.lp-stars i{font-style:normal;color:#D9CBAE;font-size:14px}
.lp-stars i.on{color:#E0A100}
.lp-stars.big i{font-size:28px}
.lp-pal{position:absolute;width:64px;pointer-events:none;z-index:4}
.lp-say{position:absolute;bottom:96%;left:50%;transform:translateX(-50%);background:#fff;border:1px solid #E2D3B5;border-radius:10px;padding:3px 9px;font-size:12px;font-weight:700;color:#B8302A;white-space:nowrap}
.lp-dec{position:absolute;transform:translate(-50%,-50%) scale(1.3);pointer-events:none;opacity:.95;z-index:1}
.lp-end{position:absolute;left:50%;transform:translateX(-50%);text-align:center;width:270px;z-index:2}
.lp-sleep{width:84px;margin:-58px auto 0;position:relative}
.lp-z{position:absolute;right:-20px;top:-6px;font-weight:700;color:#7FB5CB;font-size:14px;animation:lp-z 2.4s ease-in-out infinite}
.lp-z i{font-style:normal;font-size:18px}.lp-z b{font-size:22px}
@keyframes lp-z{0%,100%{transform:translateY(0);opacity:.55}50%{transform:translateY(-7px);opacity:1}}
.lp-soon{margin:8px 0 0;color:var(--lp-text)}
.lp-soon b{display:block;font-size:19px;color:#C2392F}
.lp-soon>span{font-size:13.5px}
/* ---------- learn: level ---------- */
.ln-top{display:flex;align-items:center;gap:12px;margin:0 auto 16px;max-width:640px}
.ln-top .icon-btn{flex:none}
.ln-dots{display:flex;gap:6px;align-items:center;flex:1}
.ln-dots span{height:9px;flex:1;max-width:70px;border-radius:5px;background:var(--line)}
.ln-dots span.past{background:var(--jade)}
.ln-dots span.cur{background:#E2453C}
.ln-dots em{font-style:normal;font-size:13px;color:var(--muted);margin-left:4px}
.ln-prog{flex:1}
.ln-card,.ln-q{background:var(--surface);border:1px solid var(--line);border-radius:18px;padding:20px;max-width:640px;margin:0 auto;min-height:240px}
.ln-nav,.ln-act{display:flex;gap:10px;justify-content:center;align-items:center;margin:16px auto;max-width:640px;flex-wrap:wrap}
.ln-h{font-size:21px;margin:0 0 8px}
.ln-rule{font-size:17px;line-height:1.65;margin:0 0 6px}
.ln-intro{display:flex;gap:16px;align-items:center;flex-wrap:wrap;justify-content:center;padding:10px 0}

function voiceNote() {
  if (!hasSpeech) return 'Audio: this browser has no speech synthesis, so listening exercises won’t play.';

}

function speak(text) {
  seqTok++;

  speechSynthesis.cancel();
  const u = new SpeechSynthesisUtterance(text); u.lang = 'zh-CN';

let seqTok = 0, seqBtn = null;
const splitSent = t => (String(t).match(/[^。！？!?]+[。！？!?]?/g) || [t]).map(s => s.trim()).filter(Boolean);
function playSeq(parts, btn) {
  if (!hasSpeech) { toast('Speech isn’t available in this browser.'); return; }
  speechSynthesis.cancel(); if (seqBtn) seqBtn.classList.remove('playing');
  const tok = ++seqTok; const segs = [];
  parts.forEach(p => { const ss = splitSent(p.t); ss.forEach((s, k) => segs.push({ t: s, gap: k === ss.length - 1 ? p.gap : 250 })); });
  let i = 0; seqBtn = btn || null; if (btn) btn.classList.add('playing');
  const next = () => {
    if (tok !== seqTok) return;
    if (i >= segs.length) { if (btn) btn.classList.remove('playing'); return; }
    const s = segs[i++]; const u = new SpeechSynthesisUtterance(s.t); u.lang = 'zh-CN';
    const v = zhVoice(); if (v) u.voice = v; u.rate = voiceRate();
    u.onend = () => setTimeout(next, s.gap); u.onerror = () => setTimeout(next, s.gap);

const SETMAP = {};

function evalLi(li, show = true) {
  if (li.dataset.skip === '1') return { got: 0, max: 0 };
  const set = SETMAP[li.dataset.set], it = set.items[+li.dataset.i], t = li.dataset.t;
  const fb = $('.fb', li); let got = 0, max = 1; const msgs = [];
  if (t === 'mc' || t === 'listen') {
    const sel = li.dataset.sel;
    got = sel !== undefined && +sel === it.c ? 1 : 0;
    if (show) {
      $$('.opt', li).forEach(b => { b.classList.toggle('right', +b.dataset.o === it.c); b.classList.toggle('wrong', b.dataset.o === sel && !got); });
      if (t === 'listen') $('.reveal', li).hidden = false;
      if (sel === undefined) msgs.push('<span class="bad-l">No answer chosen.</span>');
    }
  } else if (t === 'open') {
    got = li.dataset.self === '1' ? 1 : 0;
    if (show) { $('.model', li).hidden = false; if (li.dataset.self === undefined) msgs.push('Compare with the model answer and mark yourself.'); }
  } else {
    const ins = inputsOf(set, it); max = ins.length;
    ins.forEach((inp, k) => {
      const el = $(`[data-k="${k}"]`, li); const ok = checkOne(el.value, inp); if (ok) got++;
      if (show) {
        el.classList.toggle('ok', ok); el.classList.toggle('bad', !ok);
        if (!ok) {
          const lab = max > 1 ? (it.labels ? it.labels[k] + ': ' : `Blank ${k + 1}: `) : '';
          msgs.push(`<span class="bad-l">${esc(lab)}</span><span class="ans">${inp.mode === 'py' ? colorPy(answerText(inp)) : esc(answerText(inp))}</span>`);
        }
      }
    });
    if (show && t === 'dict') msgs.push(`<span class="muted">It said:</span> <span class="ans">${esc(it.a)}</span>`);
  }
  if (show) {
    if (it.x && got < max) msgs.push(`<span class="why">${esc(it.x)}</span>`);
    li.classList.toggle('is-right', got === max); li.classList.toggle('is-wrong', got < max);
    fb.innerHTML = (got === max && t !== 'open' ? '<span class="ok-l">Correct</span>' : '') + msgs.map(m => `<div>${m}</div>`).join('');
  }

}
function showAnswersLi(li) {

  if (t === 'mc' || t === 'listen') { $$('.opt', li).forEach(b => b.classList.toggle('right', +b.dataset.o === it.c)); if (t === 'listen') $('.reveal', li).hidden = false; fb.innerHTML = it.x ? `<span class="why">${esc(it.x)}</span>` : ''; return; }

document.addEventListener('click', e => {
  const sayEl = e.target.closest('[data-say]');
  if (sayEl) { speak(sayEl.dataset.say); return; }
  const opt = e.target.closest('.opt');
  if (opt) {
    const li = opt.closest('.item'); if (!li || li.closest('.locked')) return;
    li.dataset.sel = opt.dataset.o;
    $$('.opt', li).forEach(b => { b.classList.toggle('sel', b === opt); b.classList.remove('right', 'wrong'); });
    $('.fb', li).innerHTML = ''; li.classList.remove('is-right', 'is-wrong');
    return;
  }
  const mb = e.target.closest('[data-model]');
  if (mb) { const li = mb.closest('.item'); $('.model', li).hidden = false; return; }
  const gb = e.target.closest('[data-grade]');
  if (gb) { const li = gb.closest('.item'); li.dataset.self = gb.dataset.grade; $$('[data-grade]', li).forEach(b => b.classList.toggle('sel', b === gb)); return; }
  const act = e.target.closest('[data-act]');
  if (act) {
    const w = act.closest('.work'); if (!w) return;
    const id = w.dataset.work, lis = $$('.item', w);
    if (act.dataset.act === 'check') {
      let got = 0, max = 0; lis.forEach(li => { const r = evalLi(li); got += r.got; max += r.max; });
      if (!String(id).startsWith('syn:')) { const prev = S.sets[id]; S.sets[id] = { got, max, best: Math.max(got, prev?.best || 0) }; save(); }
      $('.score', w).innerHTML = `<b>${got} / ${max}</b> correct`;
      const firstBad = $('.is-wrong', w); if (firstBad) firstBad.scrollIntoView({ block: 'nearest', behavior: 'smooth' });
    } else if (act.dataset.act === 'show') { lis.forEach(showAnswersLi); }
    else if (act.dataset.act === 'reset') { WORK[id] && WORK[id](); }
  }
});
document.addEventListener('input', e => {
  const el = e.target;
  if (el.classList.contains('py')) { const pv = el.parentElement.querySelector('.pv'); if (pv) pv.innerHTML = /\d/.test(el.value) ? colorPy(numToMarks(el.value)) : ''; }

  if (e.key !== 'Enter' || e.isComposing || e.keyCode === 229) return;
  const el = e.target;
  if (!el.classList || !el.classList.contains('in') || el.tagName === 'TEXTAREA') return;
  if (el.closest('#c-stage') || el.closest('#t-run')) return; // handled by their own logic
  const w = el.closest('.work'); if (!w) return;
  e.preventDefault();
  const ins = $$('input.in, select.in', w); const k = ins.indexOf(el);
  if (k >= 0 && k < ins.length - 1) ins[k + 1].focus(); else $('[data-act="check"]', w).click();

  // writing
  if (d.wgroup) { W.sel.has(d.wgroup) ? W.sel.delete(d.wgroup) : W.sel.add(d.wgroup); W.i = 0; return renderWriting(); }
  if (d.wall !== undefined) { const gs = wGroups(); const all = gs.every(g => W.sel.has(g.id)); W.sel = new Set(all ? [] : gs.map(g => g.id)); W.i = 0; return renderWriting(); }
  if (d.wstart) { W.mode = d.wstart; W.screen = 'session'; W.i = 0; setFocus(true); return renderWriting(); }
  if (d.wstrip !== undefined) {
    W.stripOpen = !W.stripOpen; const s = $('#w-strip');
    s.classList.toggle('open', W.stripOpen); s.classList.toggle('row', !W.stripOpen);
    t.textContent = W.stripOpen ? 'Show less ▴' : `Show all ${wList().length} ▾`;
    return wCenterStrip();
  }
  if (d.wmenu !== undefined) { W.screen = 'menu'; setFocus(false); return renderWriting(); }
  if (d.wi !== undefined) { W.i = +d.wi; return renderWriting(); }
  if (d.wmode) { W.mode = d.wmode; return renderWriting(); }
  if (d.wopt) { W[d.wopt] = !W[d.wopt]; return renderWriting(); }
  if (d.wnav) { const n = wList().length; W.i = d.wnav === 'rand' ? Math.floor(Math.random() * n) : (W.i + (+d.wnav) + n) % n; return renderWriting(); }
  if (d.w) return wHandle(d.w);
  if (d.reset !== undefined) { $('#reset-box').innerHTML = '<span>Reset all saved progress on this device?</span> <button type="button" class="link" data-resetyes>Yes, reset</button> <button type="button" class="link" data-resetno>Cancel</button>'; return; }
  if (d.resetyes !== undefined) { S = JSON.parse(JSON.stringify(DEF)); save(); MK.hist = []; mkSaveHist(); applySettings(); $('#reset-box').innerHTML = '<button type="button" class="link" data-reset>Reset progress</button>'; toast('Progress reset.'); return go(); }
  if (d.resetno !== undefined) { $('#reset-box').innerHTML = '<button type="button" class="link" data-reset>Reset progress</button>'; return; }
});
document.addEventListener('keydown', e => {
  if (view !== 'characters' || C.screen !== 'session') return;
  const inInput = /INPUT|TEXTAREA|SELECT/.test(e.target.tagName);
  if (e.isComposing || e.keyCode === 229) return;
  if (inInput && e.target.id === 'c-in' && e.key === 'Enter') { e.preventDefault(); C.answered ? cNext() : cCheck(); return; }
  if (inInput) return;
  if (C.mode === 'flash' && C.pos < C.queue.length) {
    if (e.key === ' ' || e.key === 'Enter') { e.preventDefault(); cHandle(C.flipped ? 'good' : 'flip'); }
    else if (C.flipped && e.key === '1') cHandle('again');
    else if (C.flipped && e.key === '2') cHandle('good');
  } else if (C.mode === 'mean' && C.pos < C.queue.length) {
    if (!C.answered && /^[1-4]$/.test(e.key)) { const b = $(`[data-cpick="${+e.key - 1}"]`); if (b) b.click(); }
    else if (C.answered && e.key === 'Enter') { e.preventDefault(); cNext(); }
  }
});
document.addEventListener('keydown', e => {
  if (view !== 'test' || e.key !== 'Enter' || e.isComposing || e.keyCode === 229) return;
  const el = e.target; if (!el.closest || !el.closest('#t-run') || el.tagName === 'TEXTAREA') return;
  e.preventDefault();
  const cur = el.closest('.tq'); const ins = $$('input.in, select.in', cur); const k = ins.indexOf(el);
  if (k >= 0 && k < ins.length - 1) { ins[k + 1].focus(); return; }
  const btn = $('#t-act .btn.primary'); if (btn) btn.click();
});

function applySettings() {
  document.body.classList.toggle('hide-py', !S.settings.pinyin);
  const op = $('#opt-py'), os = $('#opt-strict'); if (op) op.checked = S.settings.pinyin; if (os) os.checked = S.settings.strict;
}
document.addEventListener('change', e => {
  if (e.target.id === 'opt-py') { S.settings.pinyin = e.target.checked; save(); applySettings(); }
  if (e.target.id === 'opt-strict') { S.settings.strict = e.target.checked; save(); }
  if (e.target.id === 'opt-nolisten') { S.settings.noListen = e.target.checked; save(); toast(e.target.checked ? 'Listening exercises are hidden.' : 'Listening exercises are back.'); go(); }
});
renderVoice();
let rT; window.addEventListener('resize', () => { clearTimeout(rT); rT = setTimeout(() => { if (view === 'writing') { const b = $('#w-box'); if (b && Math.abs(b.clientWidth - W.size) > 8 && W.mode !== 'free') mountWriter(); } }, 200); });
try { matchMedia('(prefers-color-scheme: dark)').addEventListener('change', () => { if (view === 'writing') renderWriting(); }); } catch (e) { /* old browser */ }
applySettings();
if (!/(^|\.)panda-chinese\.github\.io$/i.test(location.hostname)) { const mv = $('#moved'); if (mv) { mv.hidden = false; mv.innerHTML = 'Panda Chinese has a new home: <a href="https://panda-chinese.github.io/" target="_blank" rel="noopener"><b>panda-chinese.github.io</b></a>. To keep your progress, <button type="button" class="link" data-settings>save a backup</button> here and load it there.'; } }
go();
checkNotes();
})();
